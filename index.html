<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#7b5cff"><title>Азбука приключений 4+</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(#8ed8ff,#fff1bf);min-height:100vh;color:#34295f;overflow-x:hidden}.app{max-width:760px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header{display:flex;justify-content:space-between;align-items:center;padding:12px 4px}.pill{background:#fff9;border:2px solid #fff;border-radius:999px;padding:9px 13px;font-weight:900;box-shadow:0 4px 14px #4b3d7722}.card{background:#fffdf4;border:4px solid #fff;border-radius:28px;padding:18px;box-shadow:0 12px 30px #4b3d7728;text-align:center}.hero{font-size:72px;filter:drop-shadow(0 6px 6px #0002)}h1{font-size:clamp(30px,8vw,48px);margin:4px 0}h2{font-size:clamp(26px,7vw,40px);margin:6px 0}.big{font-size:clamp(86px,28vw,170px);font-weight:1000;line-height:1}.btn{border:0;border-radius:24px;padding:18px 22px;font-size:24px;font-weight:1000;background:linear-gradient(#8a6cff,#6747e8);color:white;box-shadow:0 7px 0 #4f35bd;margin:8px;min-width:150px}.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #4f35bd}.btn.gold{background:linear-gradient(#ffd84e,#f6a900);box-shadow:0 7px 0 #cc8500;color:#5b3b00}.btn.green{background:linear-gradient(#62db7a,#2caf55);box-shadow:0 7px 0 #218e42}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.choice{min-height:120px;border:4px solid #fff;background:#fff;border-radius:25px;font-size:58px;font-weight:1000;box-shadow:0 7px 18px #0002}.choice:active{transform:scale(.96)}.hint{font-size:20px;font-weight:800;opacity:.8}.fairy{font-size:82px;animation:float 2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}.spark{animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(1.08)}}.progress{height:18px;background:#fff8;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,#66d66e,#ffd64c);transition:.4s}.rewardGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.reward{background:#fff;border-radius:20px;padding:12px;font-size:44px;min-height:95px;display:flex;align-items:center;justify-content:center;filter:grayscale(1);opacity:.45}.reward.open{filter:none;opacity:1}.world{font-size:62px;letter-spacing:5px;margin:12px}.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:#fff;border:4px solid #ffd94f;border-radius:28px;padding:20px 28px;font-size:30px;font-weight:1000;z-index:9;box-shadow:0 15px 40px #0003;animation:pop .8s both}@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3)}60%{transform:translate(-50%,-50%) scale(1.1)}100%{transform:translate(-50%,-50%) scale(1)}}canvas{width:100%;height:320px;background:#fff;border:5px dashed #9b83ff;border-radius:25px;touch-action:none}.parent{font-size:14px;background:none;border:0;opacity:.55;padding:14px}.hidden{display:none!important}.dots{display:flex;justify-content:center;gap:8px}.dot{width:14px;height:14px;border-radius:50%;background:#ddd}.dot.on{background:#7658f4}.example{font-size:34px;font-weight:900;margin:10px}.hand{font-size:45px;animation:tap 1.1s infinite}@keyframes tap{50%{transform:translateY(8px)}}
</style></head><body><div class="app"><header><div class="pill">💎 <span id="gems">0</span></div><div class="pill">🏆 <span id="level">1</span></div></header><main id="main"></main></div><script>
'use strict';
const LETTERS=[['А','🍉','АРБУЗ'],['Б','🐿️','БЕЛКА'],['В','🐺','ВОЛК'],['Г','🍄','ГРИБ'],['Д','🏠','ДОМ'],['Е','🦝','ЕНОТ'],['Ё','🎄','ЁЛКА'],['Ж','🪲','ЖУК'],['З','🦓','ЗЕБРА'],['И','🧸','ИГРУШКА'],['Й','🥛','ЙОГУРТ'],['К','🐱','КОТ'],['Л','🦊','ЛИСА'],['М','🐻','МИШКА'],['Н','👃','НОС'],['О','☁️','ОБЛАКО'],['П','🎁','ПОДАРОК'],['Р','🐟','РЫБА'],['С','🐘','СЛОН'],['Т','🎂','ТОРТ'],['У','🦆','УТКА'],['Ф','🏳️','ФЛАГ'],['Х','🍞','ХЛЕБ'],['Ц','🌼','ЦВЕТОК'],['Ч','☕️','ЧАШКА'],['Ш','🎈','ШАР'],['Щ','🪥','ЩЁТКА'],['Ъ','🔒','ТВЁРДЫЙ ЗНАК'],['Ы','🐭','МЫШЬ'],['Ь','🔓','МЯГКИЙ ЗНАК'],['Э','🛗','ЭТАЖ'],['Ю','🌀','ЮЛА'],['Я','🍎','ЯБЛОКО']];
const PRIZES=['🐣','🧸','⚽️','🚗','🐰','🎈','🦄','🚀','🏰','🐲','👑','🌈'];
const WORDS=[['МАМА','👩'],['КОТ','🐱'],['СОМ','🐟'],['ЛУНА','🌙'],['СЛОН','🐘']];
let S={gems:0,step:0,known:0,prizes:0,attempts:{},stars:0};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('azbuka_v3')||'{}'))}catch(e){}
const $=id=>document.getElementById(id), main=$('main');
function save(){try{localStorage.setItem('azbuka_v3',JSON.stringify(S))}catch(e){} updateTop()}
function updateTop(){$('gems').textContent=S.gems;$('level').textContent=Math.max(1,S.known+1)}
function fx(type='ok'){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=type==='ok'?660:240;g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);o.start();o.stop(a.currentTime+.25)}catch(e){}}
function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
function reward(n=1){S.gems+=n;S.stars++;fx();toast('💎 +'+n);save()}
function shell(html){main.innerHTML='<section class="card">'+html+'</section>';updateTop()}
function start(){shell(`<div class="fairy">🧚‍♀️</div><h1>Азбука приключений</h1><div class="world">🌳 🏡 🌈</div><p class="hint">Нажми большую кнопку</p><div class="hand">👇</div><button class="btn green" onclick="continueGame()">▶️ ИГРАТЬ</button><br><button class="btn gold" onclick="collection()">🎁 ПРИЗЫ</button><br><button class="parent" onclick="parentInfo()">⚙️ Для взрослых</button>`)}
function continueGame(){if(S.known>=LETTERS.length){mixedGame();return} intro(S.known)}
function intro(i){let [l,emo,w]=LETTERS[i];shell(`<div class="fairy">🧚‍♀️</div><h2>Смотри!</h2><div class="big spark">${l}</div><div class="example">${emo} ${w}</div><div class="dots"><i class="dot on"></i><i class="dot"></i><i class="dot"></i></div><p class="hint">Запомни эту букву</p><button class="btn" onclick="showTogether(${i})">👀 ДАЛЬШЕ</button>`)}
function showTogether(i){let [l,emo,w]=LETTERS[i];shell(`<div class="fairy">🧚‍♀️</div><h2>Вот она — ${l}</h2><div class="big">${l}</div><div class="example">${emo} ${w}</div><p class="hint">Нажми на букву 3 раза</p><button id="tapLetter" class="choice spark" style="width:80%;font-size:100px" onclick="tapLearn(${i})">${l}</button><div class="progress"><div id="learnbar" class="bar" style="width:0%"></div></div>`);S.attempts.learnTap=0}
function tapLearn(i){S.attempts.learnTap=(S.attempts.learnTap||0)+1;fx();$('learnbar').style.width=Math.min(100,S.attempts.learnTap*34)+'%';if(S.attempts.learnTap>=3)setTimeout(()=>recognize(i,2),350)}
function recognize(i,count){let target=LETTERS[i][0], pool=LETTERS.slice(0,Math.max(i+1,4)).map(x=>x[0]).filter(x=>x!==target);while(pool.length<3)pool.push(['Б','В','Р','Д'][pool.length]);let opts=[target,...pool.sort(()=>Math.random()-.5).slice(0,count-1)].sort(()=>Math.random()-.5);shell(`<div class="fairy">🧚‍♀️</div><h2>Где ${target}?</h2><div class="hand">👇</div><div class="choices">${opts.map(x=>`<button class="choice" onclick="answer('${x}','${target}',${i},${count})">${x}</button>`).join('')}</div><p class="hint">Если забыл — подсказка покажет</p><button class="parent" onclick="intro(${i})">💡 Подсказка</button>`)}
function answer(x,t,i,count){if(x===t){reward(1);if(count<3)setTimeout(()=>recognize(i,3),500);else setTimeout(()=>trace(i),500)}else{fx('bad');toast('🧚‍♀️ Ещё раз');setTimeout(()=>intro(i),650)}}
function trace(i){let l=LETTERS[i][0];shell(`<div class="fairy">🧚‍♀️</div><h2>Нарисуй ${l}</h2><div style="position:relative"><canvas id="cv" width="600" height="360"></canvas><div id="guide" style="position:absolute;inset:35px 0 0;font-size:220px;font-weight:1000;opacity:.12;pointer-events:none">${l}</div></div><p class="hint">Веди пальчиком по большой букве</p><button id="done" class="btn hidden" onclick="finishLetter(${i})">✨ ГОТОВО</button>`);setupCanvas()}
function setupCanvas(){let c=$('cv'),ctx=c.getContext('2d'),down=false,len=0,last=null;ctx.lineWidth=20;ctx.lineCap='round';ctx.strokeStyle='#7658f4';function pos(e){let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*c.width/r.width,(p.clientY-r.top)*c.height/r.height]}function st(e){e.preventDefault();down=true;last=pos(e)}function mv(e){if(!down)return;e.preventDefault();let p=pos(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();len+=Math.hypot(p[0]-last[0],p[1]-last[1]);last=p;if(len>420)$('done').classList.remove('hidden')}function en(){down=false}c.addEventListener('touchstart',st,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',en);c.addEventListener('pointerdown',st);c.addEventListener('pointermove',mv);c.addEventListener('pointerup',en)}
function finishLetter(i){reward(3);S.known=Math.max(S.known,i+1);save();let unlock=(S.gems>=5*(S.prizes+1));shell(`<div class="fairy">🧚‍♀️</div><h1>Ура! 🎉</h1><div class="big">${LETTERS[i][0]}</div><h2>Ты выучил букву!</h2><div style="font-size:55px">💎💎💎</div>${unlock?'<button class="btn gold" onclick="openPrize()">🎁 ОТКРЫТЬ ПРИЗ</button>':'<button class="btn green" onclick="start()">➡️ ДАЛЬШЕ</button>'}`)}
function openPrize(){if(S.prizes>=PRIZES.length){start();return}let p=PRIZES[S.prizes++];save();shell(`<div class="fairy">🧚‍♀️</div><h1>Новый приз!</h1><div class="big spark">${p}</div><h2>Он теперь твой!</h2><button class="btn green" onclick="start()">▶️ ИГРАТЬ</button>`)}
function collection(){shell(`<div class="fairy">🧚‍♀️</div><h2>Мои сокровища</h2><div class="rewardGrid">${PRIZES.map((p,i)=>`<div class="reward ${i<S.prizes?'open':''}">${i<S.prizes?p:'❓'}</div>`).join('')}</div><p class="hint">Учись и собирай всю коллекцию!</p><button class="btn" onclick="start()">🏠 НАЗАД</button>`)}
function mixedGame(){let [w,e]=WORDS[Math.floor(Math.random()*WORDS.length)];shell(`<div class="fairy">🧚‍♀️</div><h2>Ты уже многое знаешь!</h2><div class="big">${e}</div><h2>${w}</h2><p class="hint">Собери слово из букв</p><div class="choices">${w.split('').sort(()=>Math.random()-.5).map(x=>`<button class="choice" onclick="fx();this.style.opacity=.35">${x}</button>`).join('')}</div><button class="btn gold" onclick="reward(2);setTimeout(start,600)">🎁 ГОТОВО</button>`)}
function parentInfo(){shell(`<h2>Для взрослых</h2><p style="font-size:20px;text-align:left"><b>Освоено букв:</b> ${S.known} из ${LETTERS.length}<br><b>Кристаллы:</b> ${S.gems}<br><b>Призы:</b> ${S.prizes}<br><br>Курс начинает обучение с нуля: знакомство → закрепление → узнавание → письмо → награда. Новая буква открывается только после предыдущей.</p><button class="btn" onclick="start()">🏠 НАЗАД</button><button class="parent" onclick="if(confirm('Сбросить прогресс?')){localStorage.removeItem('azbuka_v3');location.reload()}">Сбросить прогресс</button>`)}
start();
</script></body></html>
