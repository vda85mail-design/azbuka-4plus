<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#86d9ff,#fff1b7);color:#29334b;min-height:100vh}
.app{max-width:820px;margin:auto;padding:10px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center}.pill{border:0;background:#fff;border-radius:24px;padding:10px 14px;font-size:20px;font-weight:900;box-shadow:0 5px 16px #4563a422}
.card{background:#fffffff5;border-radius:30px;padding:18px;margin-top:12px;text-align:center;box-shadow:0 15px 40px #4563a422}.hidden{display:none!important}
.fairy{font-size:82px;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}.talk{background:#f3efff;border-radius:22px;padding:15px;margin:10px auto;max-width:590px;font-size:21px;font-weight:850;line-height:1.4}
.btn{border:0;border-radius:25px;min-height:66px;padding:13px 22px;font-size:22px;font-weight:950;background:#7057f5;color:#fff;box-shadow:0 7px 0 #4c38b2;margin:8px}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #4c38b2}.green{background:#45c77e;box-shadow:0 7px 0 #248d58}.orange{background:#ffc342;color:#553800;box-shadow:0 7px 0 #d38b00}.big{font-size:29px;min-width:min(94%,460px);min-height:86px}
.letter{font-size:165px;line-height:1;font-weight:1000;color:#7057f5;text-shadow:0 7px #e8e2ff}.word{font-size:52px;font-weight:1000;letter-spacing:3px}.pic{font-size:105px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:540px;margin:18px auto}.choice{border:0;background:white;border-radius:28px;min-height:125px;font-size:70px;font-weight:1000;box-shadow:0 7px 18px #4563a433}.choice:disabled{opacity:1}.good{background:#c9f7d9!important}.bad{animation:shake .3s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.world{font-size:65px;min-height:82px}.mission{display:inline-block;background:#fff1a9;border-radius:20px;padding:9px 15px;font-weight:950}.progress{height:18px;background:#e8e8ef;border-radius:12px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#4fd08c,#ffd348);width:0}.spark{position:fixed;pointer-events:none;font-size:32px;animation:fly 1s forwards}@keyframes fly{to{transform:translateY(-120px) scale(1.6);opacity:0}}
.parent{text-align:left;max-width:580px;margin:auto}.stat{background:#f4f1ff;border-radius:18px;padding:12px;margin:8px 0;font-weight:800}.syllable{font-size:72px;font-weight:1000;color:#7057f5;margin:12px}.small{font-size:16px;opacity:.7}.scene{font-size:92px;margin:8px}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:14px auto;max-width:600px}.mapL{border-radius:14px;padding:8px 2px;background:#e7e2ff;font-size:22px;font-weight:1000}.mapL.done{background:#bff3ce}.mapL.now{background:#ffe17a;transform:scale(1.08)}.gift{font-size:105px;cursor:pointer;animation:bob 1.2s ease-in-out infinite}.prize{font-size:92px}.celebrate{font-size:25px;font-weight:950}

.pulse{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.82}}
.questmap{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:12px auto;max-width:600px}.questL{border-radius:14px;padding:7px 2px;background:#e7e2ff;font-size:21px;font-weight:1000}.questL.done{background:#bff3ce}.questL.now{background:#ffe17a;animation:pulse 1s infinite}.castle{grid-column:span 3;font-size:46px;background:#d9d0ff;border-radius:18px;padding:4px}.location{font-size:58px;margin:4px}

#home.titleHome{min-height:calc(100svh - 92px);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;background:linear-gradient(180deg,#fffdfd 0%,#f4efff 58%,#fff7cf 100%)}
.titleSparkles{font-size:30px;letter-spacing:10px}.titleFairy{font-size:112px;line-height:1;animation:bob 2.4s ease-in-out infinite}.titleName{font-size:clamp(38px,10vw,64px);line-height:1.02;margin:8px 0 0;color:#4f3ac7;text-shadow:0 4px #fff}.titleSub{font-size:clamp(25px,6vw,38px);font-weight:1000;margin:5px 0 10px;color:#e06a26}.titleMagic{font-size:58px;margin:2px 0}.startAdventure{min-height:90px;font-size:clamp(25px,6.5vw,34px);max-width:520px;box-shadow:0 8px 0 #248d58,0 0 30px #ffd84d88}.titleResume{font-size:17px;font-weight:900;margin-top:8px}.titleProgress{width:min(86%,520px);margin:12px auto 2px}.titleParent{margin-top:12px}@media(max-width:430px){.app{padding:8px}.top{gap:6px}.pill{font-size:17px;padding:9px 11px}#home.titleHome{min-height:calc(100svh - 82px);margin-top:8px;padding:12px}.titleFairy{font-size:96px}.titleSparkles{font-size:25px}.titleMagic{font-size:52px}.startAdventure{min-height:82px;margin:5px}.titleParent{margin-top:8px}}
@media (prefers-reduced-motion: reduce){.pulse,.fairy,.titleFairy,.gift,.questL.now{animation-duration:2.5s}}
</style></head><body><main class="app">
<header class="top"><div class="pill">🧚‍♀️ Ксюша и Фея</div><div><button id="sound" class="pill">🔊</button><span class="pill">⭐ <span id="stars">0</span></span></div></header>
<section id="home" class="card titleHome"><div class="titleSparkles">✨ ⭐ ✨</div><div class="titleFairy">🧚‍♀️</div><h1 class="titleName">Ксюша и Фея</h1><div class="titleSub">Волшебная Азбука</div><div class="titleMagic pulse">🪄</div><button id="play" class="btn green big pulse startAdventure">🪄 НАЧАТЬ ПРИКЛЮЧЕНИЕ</button><div id="resumeInfo" class="titleResume hidden"></div><div id="titleProgress" class="titleProgress hidden"><div class="progress"><div id="bar" class="bar"></div></div></div><div id="world" class="hidden">✨ Волшебная дорога ✨</div><div id="homeMap" class="hidden"></div><button id="parentsBtn" class="pill titleParent">👨‍👩‍👧 Для взрослого</button></section>
<section id="game" class="card hidden"><div id="content"></div></section>
<section id="parents" class="card hidden"><div class="parent"><h2>👨‍👩‍👧 Для взрослого</h2><div id="stats"></div><button id="back" class="btn green">← В игру</button><button id="reset" class="btn orange">Начать заново</button><p class="small">Игра не показывает ребёнку оценки. Ошибки используются только для мягкого повторения трудных букв.</p></div></section>
</main>
<script>
(()=>{'use strict';
const A=[
{l:'А',sound:'а-а-а',emoji:'🍉',word:'АРБУЗ'},
{l:'Б',sound:'б-б-б',emoji:'🐿️',word:'БЕЛКА'},
{l:'В',sound:'в-в-в',emoji:'🐺',word:'ВОЛК'},
{l:'Г',sound:'г-г-г',emoji:'🍄',word:'ГРИБ'},
{l:'Д',sound:'д-д-д',emoji:'🏠',word:'ДОМ'},
{l:'Е',sound:'е',emoji:'🦝',word:'ЕНОТ'},
{l:'Ё',sound:'ё',emoji:'🎄',word:'ЁЛКА'},
{l:'Ж',sound:'ж-ж-ж',emoji:'🪲',word:'ЖУК'},
{l:'З',sound:'з-з-з',emoji:'🐰',word:'ЗАЯЦ'},
{l:'И',sound:'и-и-и',emoji:'🧸',word:'ИГРУШКА'},
{l:'Й',sound:'й',emoji:'🍶',word:'ЙОГУРТ'},
{l:'К',sound:'к-к-к',emoji:'🐱',word:'КОТ'},
{l:'Л',sound:'л-л-л',emoji:'🦊',word:'ЛИСА'},
{l:'М',sound:'м-м-м',emoji:'🐻',word:'МЕДВЕДЬ'},
{l:'Н',sound:'н-н-н',emoji:'🧦',word:'НОСКИ'},
{l:'О',sound:'о-о-о',emoji:'☁️',word:'ОБЛАКО'},
{l:'П',sound:'п-п-п',emoji:'🐓',word:'ПЕТУХ'},
{l:'Р',sound:'р-р-р',emoji:'🐟',word:'РЫБА'},
{l:'С',sound:'с-с-с',emoji:'🧃',word:'СОК'},
{l:'Т',sound:'т-т-т',emoji:'🎂',word:'ТОРТ'},
{l:'У',sound:'у-у-у',emoji:'🦆',word:'УТКА'},
{l:'Ф',sound:'ф-ф-ф',emoji:'🚩',word:'ФЛАГ'},
{l:'Х',sound:'х-х-х',emoji:'🍞',word:'ХЛЕБ'},
{l:'Ц',sound:'ц-ц-ц',emoji:'🌸',word:'ЦВЕТОК'},
{l:'Ч',sound:'ч-ч-ч',emoji:'🫖',word:'ЧАЙНИК'},
{l:'Ш',sound:'ш-ш-ш',emoji:'🎈',word:'ШАР'},
{l:'Щ',sound:'щ-щ-щ',emoji:'🪥',word:'ЩЁТКА'},
{l:'Ъ',sound:'твёрдый знак',emoji:'🔑',word:'ТВЁРДЫЙ ЗНАК'},
{l:'Ы',sound:'ы-ы-ы',emoji:'🧀',word:'СЫР'},
{l:'Ь',sound:'мягкий знак',emoji:'🧸',word:'МЯГКИЙ ЗНАК'},
{l:'Э',sound:'э-э-э',emoji:'🍦',word:'ЭСКИМО'},
{l:'Ю',sound:'ю',emoji:'🪀',word:'ЮЛА'},
{l:'Я',sound:'я',emoji:'🍎',word:'ЯБЛОКО'}
];
// Буквы изучаются строго по русскому алфавиту. Перемешивание открывается только после всех 33 букв.
const STORE='azbukaAdventure16';
let S={name:'Ксюша',idx:0,phase:'story',mastered:[],stars:0,correct:0,errors:{},sound:true,storySeen:false,gifts:[],castleOpened:false};
try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&typeof x==='object')Object.assign(S,x)}catch(e){}
// Защита от повреждённого/старого сохранения.
S.mastered=Array.isArray(S.mastered)?S.mastered.filter(x=>A.some(a=>a.l===x)).filter((x,i,a)=>a.indexOf(x)===i):[];
S.gifts=Array.isArray(S.gifts)?S.gifts:[];S.errors=(S.errors&&typeof S.errors==='object')?S.errors:{};
S.idx=Math.max(0,Math.min(A.length,Number.isFinite(+S.idx)?Math.trunc(+S.idx):0));
if(S.idx<S.mastered.length)S.idx=S.mastered.length;
if(!['story','meet','hunt','trace','finish'].includes(S.phase))S.phase=S.storySeen?'meet':'story';
const $=q=>document.querySelector(q),C=$('#content');
const V='audio/v15/';
const audio=new Audio();audio.preload='auto';audio.playsInline=true;
let currentReplay=null,voiceSeq=0,activeDone=null;
function save(){localStorage.setItem(STORE,JSON.stringify(S));let stars=$('#stars'),bar=$('#bar'),sound=$('#sound'),world=$('#world'),play=$('#play'),ri=$('#resumeInfo'),tp=$('#titleProgress');if(stars)stars.textContent=S.stars;if(bar)bar.style.width=Math.min(100,S.mastered.length/A.length*100)+'%';if(sound)sound.textContent=S.sound?'🔊':'🔇';if(world)world.textContent=`✨ ${S.mastered.length}/33   🎁 ${S.gifts.length}`;if(play)play.textContent=S.storySeen?'🪄 ПРОДОЛЖИТЬ ПУТЕШЕСТВИЕ':'🪄 НАЧАТЬ ПРИКЛЮЧЕНИЕ';if(ri&&tp){let has=S.mastered.length>0;ri.classList.toggle('hidden',!has);tp.classList.toggle('hidden',!has);if(has)ri.textContent=`✨ Уже найдено букв: ${S.mastered.length} из 33`}}
function show(id){['home','game','parents'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
function stop(complete=false){
 voiceSeq++;audio.pause();try{audio.currentTime=0}catch(e){}
 const done=activeDone;activeDone=null;audio.onended=null;audio.onerror=null;
 if(complete&&done)done();
}
function voice(key,done){
 let once=false;const finish=()=>{if(once)return;once=true;if(seq!==voiceSeq)return;activeDone=null;done&&done()};
 currentReplay=()=>voice(key,done);
 if(!S.sound){done&&done();return}
 const seq=++voiceSeq;audio.pause();audio.onended=null;audio.onerror=null;activeDone=done||null;
 audio.src=V+key+'.wav';
 audio.onended=finish;audio.onerror=finish;
 const p=audio.play();if(p&&typeof p.catch==='function')p.catch(()=>finish());
}
function talk(text,key){return `<div class="fairy">🧚‍♀️</div><div id="speech" class="talk">${text}</div><button id="repeat" class="pill">🔊 Ещё раз</button>`}
function bindRepeat(){let b=$('#repeat');if(b)b.onclick=()=>currentReplay&&currentReplay()}
function sparkle(){for(let i=0;i<10;i++){let d=document.createElement('div');d.className='spark';d.textContent='✨';d.style.left=(10+Math.random()*80)+'vw';d.style.top=(45+Math.random()*25)+'vh';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}}
function mapHTML(){return A.map((x,i)=>`<div class="questL ${S.mastered.includes(x.l)?'done':(i===S.idx?'now':'')}">${x.l}${S.mastered.includes(x.l)?'⭐':''}</div>`).join('')+`<div class="castle ${S.mastered.length===33?'pulse':''}">🏰</div>`}
function refreshHomeMap(){let m=$('#homeMap');if(m)m.innerHTML=mapHTML()}
function locationFor(i){return ['🌳🦋','☁️🌈','🌊🐚','🍄🌲','🌙⭐','❄️✨'][Math.floor(i/6)%6]}
function home(){stop();show('home');save()}
function story(){
 show('game');let t='Ксюша! Наконец-то я тебя нашла! В Стране букв все буквы уснули, и без тебя мне их не разбудить. Посмотри на волшебную дорогу: она идёт от буквы А до буквы Я, а в самом конце нас ждёт таинственный замок и большой сюрприз. Поможешь мне? Нажми на волшебную палочку — и начнём путешествие!';
 C.innerHTML=talk(t,'story_v15')+`<div class="questmap">${mapHTML()}</div><button id="go" class="btn green big pulse">🪄 НАЧАТЬ ПУТЕШЕСТВИЕ</button>`;bindRepeat();voice('story_v15');
 $('#go').onclick=()=>{stop();S.storySeen=true;S.phase='meet';save();stage()}
}
function stage(){
 show('game');
 if(!S.storySeen)return story();
 if(S.idx>=A.length){return S.castleOpened?castleReveal(true):finale()}
 let a=A[S.idx];
 if(S.phase==='meet')meet(a); else if(S.phase==='hunt')hunt(a); else if(S.phase==='trace')trace(a); else finish(a)
}
function meet(a){
 const special={
  'Ъ':'Ой, кто здесь спрятался? Это твёрдый знак — буква Ъ. Сам он звука не обозначает. Он помогает разделять части слова. Пока просто запомним, как он выглядит!',
  'Ь':'А это мягкий знак — буква Ь. Сам он звука не обозначает. Он помогает нам читать слова правильно. Пока запомним его форму!',
  'Е':'Это буква Е! В разных словах она может звучать по-разному. Сегодня запомним, как она выглядит, и послушаем её в слове «енот».',
  'Ё':'Это буква Ё! У неё две весёлые точки сверху. Послушай её в слове «ёлка».',
  'Ю':'Это буква Ю! Послушай её в слове «юла». Запомним её необычную форму.',
  'Я':'Это буква Я! Послушай её в слове «яблоко». Это последняя буква нашего алфавита!'
 };
 let t=special[a.l]||`Ой, кто здесь спрятался? Это буква ${a.l}! Послушай: ${a.sound}. ${a.word[0]+a.word.slice(1).toLowerCase()}. Послушай первый звук. Давай скажем вместе: ${a.sound}!`;
 t += ' А теперь нажми на волшебную кнопку и разбуди букву!'; C.innerHTML=talk(t,`meet15_${a.l}`)+`<div class="location">${locationFor(S.idx)}</div><div class="letter">${a.l}</div><div class="pic">${a.emoji}</div><div class="word">${a.word}</div><button id="next" class="btn green big pulse">✨ РАЗБУДИТЬ БУКВУ</button>`;bindRepeat();voice(`meet15_${a.l}`);
 $('#next').onclick=()=>{stop();S.phase='hunt';save();stage()}
}
function hunt(a){
 let learned=S.mastered.slice(),opts=[a.l];
 learned.slice().sort(()=>Math.random()-.5).forEach(x=>{if(opts.length<4&&!opts.includes(x))opts.push(x)});
 opts.sort(()=>Math.random()-.5);
 let t=`Буква ${a.l} проснулась! Теперь найди букву ${a.l} среди других букв и нажми на неё.`;
 if(opts.length===1){
   C.innerHTML=talk(t,`hunt15_${a.l}`)+`<div class="scene">🫧 ✨ 🫧</div><button class="choice" data-l="${a.l}">${a.l}</button>`;
 }else C.innerHTML=talk(t,`hunt15_${a.l}`)+`<div class="choices">${opts.map(x=>`<button class="choice" data-l="${x}">${x}</button>`).join('')}</div>`;
 bindRepeat();voice(`hunt15_${a.l}`);C.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b,a));
}
function answer(b,a){
 stop();
 if(b.dataset.l===a.l){
   C.querySelectorAll('.choice').forEach(x=>x.disabled=true);
   S.correct++;S.stars++;save();b.classList.add('good');sparkle();
   let t=`Правильно! Это буква ${a.l}! Молодец! А теперь нажми на светящуюся кнопку и проведи пальчиком по большой букве.`;
   $('#speech').textContent=t;
   const next=document.createElement('button');next.id='toTrace';next.className='btn green big pulse';next.textContent='✏️ ОБВЕСТИ БУКВУ';C.appendChild(next);
   next.onclick=()=>{stop();S.phase='trace';save();stage()};
   voice(`right15_${a.l}`);
 }else{
   S.errors[a.l]=(S.errors[a.l]||0)+1;save();b.classList.add('bad');
   let t=`Почти! Нам нужна буква ${a.l}. Посмотри внимательно и нажми на букву ${a.l}.`; $('#speech').textContent=t;voice(`wrong15_${a.l}`);setTimeout(()=>b.classList.remove('bad'),600);
 }
}
function trace(a){
 let t=`Проведи пальчиком по большой светящейся букве ${a.l}. Можно немного криво — главное, чтобы получилось похоже на букву!`;
 C.innerHTML=talk(t,`trace15_${a.l}`)+`<div style="position:relative;width:min(90vw,340px);height:310px;margin:8px auto"><canvas id="guide" width="340" height="310" style="position:absolute;inset:0;width:100%;height:100%"></canvas><canvas id="cv" width="340" height="310" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas></div><div id="traceMsg" class="mission">Веди пальчиком по букве. Можно немного выходить за дорожку ✨</div><button id="retryTrace" class="pill pulse" style="display:none">🔄 Попробовать ещё раз</button>`;bindRepeat();voice(`trace15_${a.l}`);
 const W=340,H=310,cv=$('#cv'),ctx=cv.getContext('2d'),g=$('#guide').getContext('2d'),msg=$('#traceMsg'),retry=$('#retryTrace');
 const exact=document.createElement('canvas'),allow=document.createElement('canvas');exact.width=allow.width=W;exact.height=allow.height=H;
 const ex=exact.getContext('2d',{willReadFrequently:true}),al=allow.getContext('2d',{willReadFrequently:true});
 const font='900 230px -apple-system,BlinkMacSystemFont,"Arial",sans-serif';
 function glyph(c,fill,stroke=false){c.clearRect(0,0,W,H);c.font=font;c.textAlign='center';c.textBaseline='middle';c.fillStyle=fill;c.strokeStyle=fill;c.lineJoin='round';c.lineWidth=40;if(stroke)c.strokeText(a.l,W/2,H/2+2);c.fillText(a.l,W/2,H/2+2)}
 glyph(ex,'#000');glyph(al,'#000',true);glyph(g,'#e6ddff');g.font=font;g.textAlign='center';g.textBaseline='middle';g.strokeStyle='#b7a8ff';g.lineWidth=3;g.strokeText(a.l,W/2,H/2+2);
 const ed=ex.getImageData(0,0,W,H).data,ad=al.getImageData(0,0,W,H).data,CELL=20;
 const alpha=(d,x,y)=>{x=Math.max(0,Math.min(W-1,x|0));y=Math.max(0,Math.min(H-1,y|0));return d[(y*W+x)*4+3]};
 const inside=(x,y)=>alpha(ad,x,y)>25;
 let cells=new Set();for(let y=0;y<H;y+=CELL)for(let x=0;x<W;x+=CELL){let hit=false;for(let yy=y;yy<Math.min(H,y+CELL)&&!hit;yy+=5)for(let xx=x;xx<Math.min(W,x+CELL);xx+=5)if(alpha(ed,xx,yy)>35){hit=true;break}if(hit)cells.add(Math.floor(y/CELL)*100+Math.floor(x/CELL))}
 let seen=new Set(),down=false,last=null,completed=false,total=0,good=0,bad=0,raf=0,pending=null;
 const pos=e=>{let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
 function mark(x,y){let k=Math.floor(y/CELL)*100+Math.floor(x/CELL);if(cells.has(k))seen.add(k)}
 function coverage(){return seen.size/Math.max(1,cells.size)}
 function resetAttempt(clearAll=false){down=false;last=null;bad=0;total=0;good=0;if(clearAll){seen.clear();ctx.clearRect(0,0,W,H)}retry.style.display='none'}
 retry.onclick=()=>{stop();resetAttempt(true);msg.textContent='✨ Давай ещё раз!';voice(`retry15_${a.l}`)};
 function checkDone(){if(completed)return;let cov=coverage(),quality=good/Math.max(1,total);if(cov>=.38&&quality>=.58&&good>=24){completed=true;down=false;msg.textContent='✨ Получилось!';sparkle();setTimeout(()=>{S.phase='finish';save();stage()},350)}}
 function drawTo(p){if(!down||completed||!last)return;let d=Math.hypot(p.x-last.x,p.y-last.y),n=Math.max(1,Math.ceil(d/7));for(let i=1;i<=n;i++){let u=i/n,x=last.x+(p.x-last.x)*u,y=last.y+(p.y-last.y)*u;total++;if(inside(x,y)){good++;mark(x,y)}else bad++}ctx.lineTo(p.x,p.y);ctx.stroke();last=p;if(bad>Math.max(14,total*.48)){down=false;last=null;msg.textContent='😊 Почти! Попробуй по светящейся дорожке';retry.style.display='inline-block';voice(`retry15_${a.l}`);return}checkDone()}
 cv.onpointerdown=e=>{if(completed)return;stop();e.preventDefault();let p=pos(e);if(!inside(p.x,p.y)){msg.textContent='😊 Начни прямо на светящейся букве';retry.style.display='inline-block';voice(`retry15_${a.l}`);return}down=true;last=p;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);ctx.lineWidth=18;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#7057f5';ctx.beginPath();ctx.moveTo(p.x,p.y);total++;good++;mark(p.x,p.y)};
 cv.onpointermove=e=>{if(!down||completed)return;e.preventDefault();pending=pos(e);if(!raf)raf=requestAnimationFrame(()=>{raf=0;let p=pending;pending=null;if(p)drawTo(p)})};
 cv.onpointerup=()=>{if(!down||completed)return;down=false;last=null;checkDone();if(!completed){msg.textContent='✨ Ещё немножко!';retry.style.display='inline-block'}};
 cv.onpointercancel=()=>{down=false;last=null};
}
function finish(a){
 let t=`Получилось! Буква ${a.l} засияла! Молодец, Ксюша! А теперь нажми на волшебный подарок.`;
 C.innerHTML=talk(t,`finish15_${a.l}`)+`<div class="celebrate">🎉 ${a.l} 🎉</div><div id="gift" class="gift pulse" aria-label="Подарок">🎁</div>`;bindRepeat();voice(`finish15_${a.l}`);sparkle();
 $('#gift').onclick=()=>{stop();openGift(a)}
}
const PRIZES=['🦄','🐰','🐲','👑','🌸','🧸','🦋','🏰','🌈','⭐','🐱','🎠'];
function openGift(a){
 if(S.mastered.includes(a.l)){S.idx=Math.max(S.idx,S.mastered.length);S.phase='meet';save();return stage()}
 const oldIdx=S.idx;S.mastered.push(a.l);
 let prize=PRIZES[(S.mastered.length-1)%PRIZES.length];S.gifts.push(prize);S.stars+=3;
 let last=S.mastered.length===A.length,nextLetter=last?null:A[oldIdx+1].l;
 // Фиксируем прогресс сразу, чтобы перезапуск не дублировал подарок.
 S.idx=Math.min(A.length,oldIdx+1);S.phase='meet';save();sparkle();
 let key=last?'gift15_last':'gift15_next_'+nextLetter;
 let t=last?'Ура! Последний подарок в твоей коллекции! Все буквы от А до Я теперь светятся. Нажми на замок — нас ждёт главный сюрприз!':`Сюрприз! Новый подарок теперь в твоей коллекции. Молодец, Ксюша! А теперь нажми на большую стрелочку — полетим знакомиться с буквой ${nextLetter}!`;
 C.innerHTML=talk(t,key)+`<div class="prize">${prize}</div><div class="talk" aria-label="Коллекция подарков">${S.gifts.join(' ')}</div><button id="next" class="btn green big pulse" aria-label="Дальше">${last?'🏰 ✨':'➡️ ✨'}</button>`;bindRepeat();voice(key);
 $('#next').onclick=()=>{stop();stage()}
}
function finale(){
 let t='Ксюша, ты прошла всю волшебную Азбуку — от буквы А до буквы Я! Все буквы светятся, и ворота замка открываются. Нажми на замок — пора узнать главный секрет!';
 C.innerHTML=talk(t,'castle_ready')+`<div class="questmap">${mapHTML()}</div><button id="castleBtn" class="btn green big pulse">🏰 ОТКРЫТЬ ЗАМОК</button>`;bindRepeat();voice('castle_ready');sparkle();
 $('#castleBtn').onclick=()=>{stop();S.castleOpened=true;save();castleReveal()}
}
function castleReveal(resume=false){
 let t='Ксюша! Ты справилась! А теперь самый главный секрет… Этот волшебный замок подарил тебе папа Денис! Он очень тобой гордится. Замок теперь твой!';
 C.innerHTML=talk(t,'castle_reveal')+`<div class="scene pulse">🏰🎆👑✨</div><div class="celebrate">🏰 Замок Ксюши 🏰</div><button id="challenge" class="btn green big pulse">🎲 ИГРАТЬ С БУКВАМИ</button>`;bindRepeat();if(!resume)voice('castle_reveal');else currentReplay=()=>voice('castle_reveal');sparkle();
 $('#challenge').onclick=()=>{stop();review()}
}
function review(){
 let pool=S.mastered.slice(); if(pool.length<33)return stage();
 let weighted=[];pool.forEach(x=>{weighted.push(x);for(let i=0;i<(S.errors[x]||0);i++)weighted.push(x)});
 let target=weighted[Math.floor(Math.random()*weighted.length)];
 let opts=[target];pool.slice().sort(()=>Math.random()-.5).forEach(x=>{if(opts.length<4&&!opts.includes(x))opts.push(x)});opts.sort(()=>Math.random()-.5);
 let t=`А теперь игра со всеми буквами! Найди букву ${target} и нажми на неё.`;
 C.innerHTML=talk(t,`review15_${target}`)+`<div class="choices">${opts.map(x=>`<button class="choice" data-l="${x}">${x}</button>`).join('')}</div>`;bindRepeat();voice(`review15_${target}`);
 C.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{stop();if(b.dataset.l===target){C.querySelectorAll('.choice').forEach(x=>x.disabled=true);S.correct++;S.stars++;save();b.classList.add('good');sparkle();$('#speech').textContent='Вот это да! Ты узнала её среди других букв! Нажми на стрелочку — найдём следующую.';const next=document.createElement('button');next.className='btn green big pulse';next.textContent='➡️ ЕЩЁ БУКВА';C.appendChild(next);next.onclick=()=>{stop();review()};voice('review15_right')}else{S.errors[target]=(S.errors[target]||0)+1;save();b.classList.add('bad');$('#speech').textContent=`Почти! Посмотри внимательно. Нам нужна буква ${target}.`;voice(`review15_hint_${target}`);setTimeout(()=>b.classList.remove('bad'),600)}})
}
function parents(){stop();show('parents');$('#stats').innerHTML=`<div class="stat">Изучено: ${S.mastered.join(', ')||'пока нет'}</div><div class="stat">⭐ Звёзды: ${S.stars}</div><div class="stat">✅ Успешных ответов: ${S.correct}</div><div class="stat">🧠 Нуждаются в повторении: ${Object.entries(S.errors).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]+' ('+x[1]+')').join(', ')||'нет'}</div>`}
$('#play').onclick=()=>{stop();if(!S.storySeen&&S.idx===0&&S.mastered.length===0)story();else stage()};
$('#parentsBtn').onclick=parents;$('#back').onclick=home;$('#sound').onclick=()=>{S.sound=!S.sound;if(!S.sound)stop(true);save()};
$('#reset').onclick=()=>{stop();localStorage.removeItem(STORE);location.reload()};save();
window.addEventListener('load',()=>{if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});setTimeout(()=>{if(S.sound&&!audio.src){audio.src=V+'story_v15.wav';audio.load()}},250)});
})();
</script></body></html>
