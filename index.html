<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#8ad7ff"><title>Азбука приключений 4+</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#8edcff,#fff1a9);color:#26334d;min-height:100vh}.app{max-width:900px;margin:auto;min-height:100vh;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-size:clamp(22px,5vw,38px);font-weight:900}.pill{background:#fff;border:0;border-radius:22px;padding:10px 14px;font-size:18px;font-weight:900;box-shadow:0 5px 15px #4563a422}.card{background:#fffffff2;border-radius:30px;padding:20px;box-shadow:0 15px 40px #4563a422;margin-top:14px}.hero{text-align:center}.fairy{font-size:86px;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}h1,h2{margin:8px}.hint{font-size:20px;font-weight:800;line-height:1.35}.btn{border:0;border-radius:24px;min-height:64px;padding:14px 22px;font-size:21px;font-weight:900;background:#7057f5;color:#fff;box-shadow:0 7px 0 #4c38b2;margin:8px;touch-action:manipulation}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #4c38b2}.btn.orange{background:#ffc342;color:#553800;box-shadow:0 7px 0 #d38b00}.btn.green{background:#49c985;box-shadow:0 7px 0 #218c56}.name{width:min(100%,380px);font-size:24px;padding:16px;border:3px solid #d8d4ff;border-radius:20px;text-align:center}.hidden{display:none!important}.world{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tile{border:0;background:#fff;border-radius:28px;min-height:150px;padding:16px;font-size:20px;font-weight:900;box-shadow:0 8px 20px #4563a422}.tile .ico{display:block;font-size:58px;margin-bottom:8px}.lesson{text-align:center}.letter{font-size:150px;line-height:1;font-weight:1000;color:#7057f5;text-shadow:0 6px #e7e1ff}.choices{display:grid;grid-template-columns:repeat(2,minmax(110px,1fr));gap:14px;max-width:520px;margin:18px auto}.choice{border:0;background:#fff;border-radius:28px;min-height:120px;font-size:66px;font-weight:1000;box-shadow:0 7px 18px #4563a433}.choice.good{background:#bdf4d2}.choice.bad{animation:shake .3s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.progress{height:18px;background:#e8e8ef;border-radius:12px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#4fd08c,#ffd348);width:0}.canvasWrap{position:relative;background:#fff;border:5px dashed #b9aaff;border-radius:28px;overflow:hidden;margin:14px auto;max-width:430px}.guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:245px;font-weight:1000;color:#ded8ff;pointer-events:none}canvas{position:relative;display:block;width:100%;height:330px;touch-action:none}.word{font-size:clamp(44px,11vw,76px);font-weight:1000;letter-spacing:4px}.bigpic{font-size:100px}.back{float:left;min-height:48px;padding:8px 14px;font-size:24px}.speaker{font-size:32px;min-width:70px}.reward{font-size:100px;animation:pop .5s}@keyframes pop{50%{transform:scale(1.25)}}.parentBox{max-width:560px;margin:auto;text-align:left}.stat{background:#f4f1ff;border-radius:18px;padding:14px;margin:8px 0;font-weight:800}.footer{text-align:center;padding:18px;opacity:.55;font-size:13px}@media(max-width:480px){.app{padding:9px}.card{padding:14px}.fairy{font-size:72px}.world{gap:10px}.tile{min-height:130px;font-size:17px}.tile .ico{font-size:48px}.letter{font-size:125px}.btn{font-size:19px}.guide{font-size:220px}}
</style></head><body><main class="app"><header class="top"><div class="logo">🪄 Азбука</div><div><button id="soundBtn" class="pill" aria-label="Звук">🔊</button><span class="pill">⭐ <span id="stars">0</span></span></div></header>
<section id="welcome" class="card hero"><div class="fairy">🧚‍♀️</div><h1>Привет!</h1><p class="hint">Как тебя зовут?</p><input id="name" class="name" placeholder="Имя" maxlength="18" autocomplete="off"><br><button id="startBtn" class="btn green">▶️ НАЧАТЬ</button><p>👆</p></section>
<section id="home" class="hidden"><div class="card hero"><div class="fairy">🧚‍♀️</div><h2 id="hello">Привет!</h2><div class="progress"><div id="bar" class="bar"></div></div></div><div class="card"><div class="world"><button class="tile" data-mode="find"><span class="ico">👀</span>Буквы</button><button class="tile" data-mode="write"><span class="ico">✍️</span>Пишем</button><button class="tile" data-mode="syllables"><span class="ico">🗣️</span>Слоги</button><button class="tile" data-mode="words"><span class="ico">🧩</span>Слова</button><button class="tile" data-mode="read"><span class="ico">📖</span>Читаем</button><button class="tile" data-mode="adventure"><span class="ico">🏰</span>Играть</button></div></div><div class="card hero"><button id="parentBtn" class="pill">👨‍👩‍👧 Для родителей</button></div></section>
<section id="lesson" class="card lesson hidden"><button id="backBtn" class="btn orange back">🏠</button><div style="clear:both"></div><div id="content"></div></section>
<section id="parent" class="card hidden"><button id="parentBack" class="btn orange back">🏠</button><div style="clear:both"></div><div class="parentBox"><h2>👨‍👩‍👧 Родительский раздел</h2><div id="stats"></div><button id="resetBtn" class="btn orange">Сбросить прогресс</button></div></section><div class="footer">4+ • прогресс сохраняется на устройстве</div></main>
<script>
(function(){'use strict';
var ABC=['А','Б','В','Г','Д','Е','Ё','Ж','З','И','Й','К','Л','М','Н','О','П','Р','С','Т','У','Ф','Х','Ц','Ч','Ш','Щ','Ъ','Ы','Ь','Э','Ю','Я'];
var SOUNDS={А:'а',Б:'б',В:'в',Г:'г',Д:'д',Е:'е',Ё:'ё',Ж:'ж',З:'з',И:'и',Й:'й',К:'к',Л:'л',М:'м',Н:'н',О:'о',П:'п',Р:'р',С:'с',Т:'т',У:'у',Ф:'ф',Х:'х',Ц:'ц',Ч:'ч',Ш:'ш',Щ:'щ',Ъ:'твёрдый знак',Ы:'ы',Ь:'мягкий знак',Э:'э',Ю:'ю',Я:'я'};
var WORDS=[['КОТ','🐱'],['ДОМ','🏠'],['СОК','🧃'],['ЛУНА','🌙'],['РЫБА','🐟'],['МАК','🌺'],['СЫР','🧀'],['МЯЧ','⚽'],['ЛИСА','🦊'],['УТКА','🦆'],['МЫШЬ','🐭'],['СОВА','🦉']];
var SYL=['МА','МО','МУ','ПА','ПО','ПУ','СА','СО','СУ','РА','РО','РУ','ЛА','ЛО','ЛУ','НА','НО','НУ'];
var READ=['КОТ СПИТ.','ПАПА ДОМА.','У ЛЕНЫ КОТ.','НА НЕБЕ ЛУНА.','МАМА И ПАПА ДОМА.'];
var state={name:'',stars:0,correct:0,attempts:0,writes:0,syllables:0,words:0,reads:0,sound:true,seen:{}};
try{var old=JSON.parse(localStorage.getItem('azbuka4')||'null');if(old)Object.assign(state,old)}catch(e){}
var $=function(s){return document.querySelector(s)}, content=$('#content');
function save(){try{localStorage.setItem('azbuka4',JSON.stringify(state))}catch(e){} $('#stars').textContent=state.stars;var total=state.correct+state.writes+state.syllables+state.words+state.reads;$('#bar').style.width=Math.min(100,total/50*100)+'%';$('#soundBtn').textContent=state.sound?'🔊':'🔇'}
function say(t){if(!state.sound)return;if('speechSynthesis' in window){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.72;u.pitch=1.08;speechSynthesis.speak(u)}catch(e){}}}
function show(id){['welcome','home','lesson','parent'].forEach(function(x){$('#'+x).classList.toggle('hidden',x!==id)})}
function start(){var n=$('#name').value.trim();state.name=n||state.name||'друг';save();home();setTimeout(function(){say(state.name+', привет! Выбери картинку. Я всё расскажу.')},250)}
function home(){show('home');$('#hello').textContent='Привет, '+(state.name||'друг')+'! ⭐';save()}
function reward(next){state.stars++;save();content.innerHTML='<div class="reward">⭐</div><h2>Ура!</h2>';say('Молодец! Звёздочка твоя!');setTimeout(next,900)}
function random(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}
function findLetter(){var target=random(ABC.filter(function(x){return x!=='Ъ'&&x!=='Ь'}));state.seen[target]=(state.seen[target]||0)+1;var opts=[target];while(opts.length<4){var x=random(ABC);if(opts.indexOf(x)<0)opts.push(x)}opts=shuffle(opts);content.innerHTML='<div class="fairy">🧚‍♀️</div><h2 class="hint">Найди букву</h2><button class="btn speaker" id="repeat">🔊</button><div class="choices">'+opts.map(function(x){return '<button class="choice" data-letter="'+x+'">'+x+'</button>'}).join('')+'</div>';say('Найди букву '+SOUNDS[target]);$('#repeat').onclick=function(){say('Найди букву '+SOUNDS[target])};Array.prototype.forEach.call(content.querySelectorAll('.choice'),function(b){b.onclick=function(){state.attempts++;if(b.getAttribute('data-letter')===target){state.correct++;b.classList.add('good');save();say('Да! Это '+SOUNDS[target]);setTimeout(function(){reward(findLetter)},350)}else{b.classList.add('bad');say('Почти. Попробуй ещё.');setTimeout(function(){b.classList.remove('bad')},400)}}})}
function setupCanvas(letter){var c=$('#draw'),ctx=c.getContext('2d'),down=false,last=null,drawn=false;ctx.lineWidth=20;ctx.lineCap='round';ctx.strokeStyle='#7057f5';function pos(e){var r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:(q.clientX-r.left)*c.width/r.width,y:(q.clientY-r.top)*c.height/r.height}}function begin(e){e.preventDefault();down=true;last=pos(e);drawn=true}function move(e){if(!down)return;e.preventDefault();var p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function end(){down=false}c.addEventListener('pointerdown',begin);c.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:false});$('#clear').onclick=function(){ctx.clearRect(0,0,c.width,c.height);drawn=false;say('Попробуй ещё раз')};$('#doneWrite').onclick=function(){if(!drawn){say('Сначала проведи пальчиком по букве');return}state.writes++;save();reward(writeLetter)};say('Проведи пальчиком по букве '+SOUNDS[letter])}
function writeLetter(){var letter=random(ABC.filter(function(x){return ['Ъ','Ь','Й'].indexOf(x)<0}));content.innerHTML='<div class="fairy">🧚‍♀️</div><h2 class="hint">Проведи пальчиком</h2><button class="btn speaker" id="repeat">🔊</button><div class="canvasWrap"><div class="guide">'+letter+'</div><canvas id="draw" width="430" height="330"></canvas></div><button id="clear" class="btn orange">↻</button><button id="doneWrite" class="btn green">⭐ ГОТОВО</button>';$('#repeat').onclick=function(){say('Проведи пальчиком по букве '+SOUNDS[letter])};setupCanvas(letter)}
function syllables(){var s=random(SYL);content.innerHTML='<div class="fairy">🧚‍♀️</div><h2 class="hint">Слушай и повторяй</h2><div class="word">'+s.charAt(0)+' + '+s.charAt(1)+' = '+s+'</div><button class="btn speaker" id="hear">🔊</button><button class="btn green" id="again">⭐ ЕЩЁ</button>';function voice(){say(SOUNDS[s.charAt(0)]+'. '+SOUNDS[s.charAt(1)]+'. Вместе: '+s)}$('#hear').onclick=voice;$('#again').onclick=function(){state.syllables++;save();reward(syllables)};voice()}
function words(){var p=random(WORDS);content.innerHTML='<div class="bigpic">'+p[1]+'</div><div class="word">'+p[0]+'</div><button class="btn speaker" id="hear">🔊</button><button class="btn green" id="next">⭐ ЕЩЁ</button>';$('#hear').onclick=function(){say(p[0])};$('#next').onclick=function(){state.words++;save();reward(words)};say('Что это? Нажми на звук, потом повтори слово.')}
function read(){var t=random(READ);content.innerHTML='<div class="fairy">📚🧚‍♀️</div><h2 class="hint">Попробуй прочитать</h2><div class="word" style="font-size:clamp(34px,8vw,55px)">'+t+'</div><button class="btn speaker" id="hear">🔊</button><button class="btn green" id="next">⭐ ПРОЧИТАЛ</button>';$('#hear').onclick=function(){say(t)};$('#next').onclick=function(){state.reads++;save();reward(read)};say('Попробуй прочитать. Если трудно, нажми на динамик.')}
function adventure(){var kinds=[findLetter,writeLetter,syllables,words];content.innerHTML='<div class="fairy">🧚‍♀️</div><div class="bigpic">🏰</div><h2>Спасём волшебный замок!</h2><button class="btn green" id="go">▶️</button>';say('В замке потерялись буквы. Поможешь мне? Нажми большую кнопку.');$('#go').onclick=function(){random(kinds)()}}
function openMode(m){show('lesson');if(m==='find')findLetter();else if(m==='write')writeLetter();else if(m==='syllables')syllables();else if(m==='words')words();else if(m==='read')read();else adventure()}
function parents(){show('parent');var accuracy=state.attempts?Math.round(state.correct/state.attempts*100):0;$('#stats').innerHTML='<div class="stat">⭐ Звёзды: '+state.stars+'</div><div class="stat">🔤 Верных ответов: '+state.correct+' из '+state.attempts+' ('+accuracy+'%)</div><div class="stat">✍️ Упражнений письма: '+state.writes+'</div><div class="stat">🗣️ Слогов: '+state.syllables+'</div><div class="stat">🧩 Слов: '+state.words+'</div><div class="stat">📖 Чтение: '+state.reads+'</div>'}
$('#startBtn').addEventListener('click',start);$('#backBtn').addEventListener('click',home);$('#parentBack').addEventListener('click',home);$('#parentBtn').addEventListener('click',parents);$('#soundBtn').addEventListener('click',function(){state.sound=!state.sound;save();if(state.sound)say('Звук включён')});Array.prototype.forEach.call(document.querySelectorAll('.tile'),function(b){b.addEventListener('click',function(){openMode(b.getAttribute('data-mode'))})});$('#resetBtn').addEventListener('click',function(){if(confirm('Сбросить весь прогресс?')){try{localStorage.removeItem('azbuka4')}catch(e){}location.reload()}});
save();if(state.name){$('#name').value=state.name;home()}else{show('welcome');setTimeout(function(){say('Привет! Как тебя зовут?')},400)}
})();
</script></body></html>
