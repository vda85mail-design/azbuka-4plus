<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#8edcff"><title>Азбука приключений 4+</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#8edcff,#fff1a9);color:#26334d;min-height:100vh}.app{max-width:820px;margin:auto;min-height:100vh;padding:10px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:1000}.pill,.iconBtn{border:0;background:#fff;border-radius:22px;padding:10px 14px;font-size:20px;font-weight:900;box-shadow:0 5px 15px #4563a422}.card{background:#fffffff3;border-radius:30px;padding:18px;box-shadow:0 15px 40px #4563a422;margin-top:12px;text-align:center}.fairy{font-size:84px;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}.btn{border:0;border-radius:25px;min-height:68px;padding:14px 22px;font-size:22px;font-weight:1000;background:#7057f5;color:white;box-shadow:0 7px 0 #4c38b2;margin:8px;touch-action:manipulation}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #4c38b2}.green{background:#45c77e;box-shadow:0 7px 0 #248d58}.orange{background:#ffc342;color:#553800;box-shadow:0 7px 0 #d38b00}.bigPlay{font-size:32px;min-width:min(92%,440px);min-height:90px}.hidden{display:none!important}.letter{font-size:170px;line-height:1;font-weight:1000;color:#7057f5;text-shadow:0 7px #e8e2ff}.hint{font-size:22px;font-weight:900;line-height:1.35}.tiny{opacity:.7;font-weight:800}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:540px;margin:16px auto}.choice{border:0;background:#fff;border-radius:28px;min-height:130px;font-size:72px;font-weight:1000;box-shadow:0 7px 18px #4563a433}.choice.good{background:#bdf4d2;transform:scale(1.04)}.choice.bad{animation:shake .3s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.progress{height:19px;background:#e8e8ef;border-radius:12px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#4fd08c,#ffd348);width:0}.world{font-size:72px;margin:8px}.chest{font-size:115px;animation:pop .7s}.rewardGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px auto;max-width:480px}.rewardItem{background:#f5f1ff;border-radius:20px;padding:12px;font-size:42px}.locked{filter:grayscale(1);opacity:.35}.canvasWrap{position:relative;background:white;border:5px dashed #b9aaff;border-radius:28px;overflow:hidden;margin:12px auto;max-width:430px}.guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:245px;font-weight:1000;color:#ded8ff;pointer-events:none}canvas{position:relative;display:block;width:100%;height:330px;touch-action:none}.word{font-size:clamp(48px,12vw,78px);font-weight:1000;letter-spacing:4px}.bigpic{font-size:105px}.parent{max-width:560px;margin:auto;text-align:left}.stat{background:#f4f1ff;border-radius:18px;padding:13px;margin:8px 0;font-weight:850}.back{float:left;min-height:48px;padding:7px 14px;font-size:24px}.name{width:min(100%,380px);font-size:24px;padding:15px;border:3px solid #d8d4ff;border-radius:20px;text-align:center}.spark{position:fixed;pointer-events:none;font-size:32px;animation:fly 1s forwards}@keyframes fly{to{transform:translateY(-120px) scale(1.6);opacity:0}}@media(max-width:480px){.letter{font-size:140px}.fairy{font-size:72px}.choice{font-size:62px;min-height:110px}.guide{font-size:220px}}
</style></head><body><main class="app"><header class="top"><div class="logo">🪄 Азбука</div><div><button id="sound" class="pill">🔊</button><span class="pill">💎 <span id="gems">0</span></span></div></header>
<section id="setup" class="card hidden"><div class="fairy">🧚‍♀️</div><h1>Для взрослого 👨‍👩‍👧</h1><p class="hint">Как зовут ребёнка?</p><input id="name" class="name" placeholder="Имя" maxlength="18"><br><button id="saveName" class="btn green">ГОТОВО ✓</button><p class="tiny">Имя вводится один раз. Дальше ребёнку читать меню не нужно.</p></section>
<section id="home" class="hidden"><div class="card"><div class="fairy">🧚‍♀️</div><h2 id="hello">Привет!</h2><div class="progress"><div id="bar" class="bar"></div></div><div class="world" id="world">🏡🌳</div><button id="continue" class="btn green bigPlay">▶️ ИГРАТЬ</button><br><button id="collection" class="iconBtn">🎁 Мои призы</button> <button id="parent" class="iconBtn">👨‍👩‍👧</button></div></section>
<section id="lesson" class="card hidden"><button id="back" class="btn orange back">🏠</button><div style="clear:both"></div><div id="content"></div></section>
<section id="prizes" class="card hidden"><button class="btn orange back homeBack">🏠</button><div style="clear:both"></div><h2>🎁 Мои сокровища</h2><div id="prizeGrid" class="rewardGrid"></div><p class="hint">Собирай 💎 и открывай новые подарки!</p></section>
<section id="parents" class="card hidden"><button class="btn orange back homeBack">🏠</button><div style="clear:both"></div><div class="parent"><h2>👨‍👩‍👧 Для родителей</h2><div id="stats"></div><button id="rename" class="btn">Изменить имя</button><button id="reset" class="btn orange">Сбросить прогресс</button></div></section></main>
<script>(function(){'use strict';
var CURRICULUM=[
 {l:'А',sound:'а',emoji:'🍉',word:'АРБУЗ'}, {l:'М',sound:'м',emoji:'🚗',word:'МАШИНА'}, {l:'О',sound:'о',emoji:'☁️',word:'ОБЛАКО'}, {l:'С',sound:'с',emoji:'🧃',word:'СОК'}, {l:'У',sound:'у',emoji:'🦆',word:'УТКА'}, {l:'Н',sound:'н',emoji:'👃',word:'НОС'}, {l:'К',sound:'к',emoji:'🐱',word:'КОТ'}, {l:'Т',sound:'т',emoji:'🎂',word:'ТОРТ'}, {l:'П',sound:'п',emoji:'🎁',word:'ПОДАРОК'}, {l:'И',sound:'и',emoji:'🦃',word:'ИНДЮК'}
];
var PRIZES=['🐣','🧸','🚗','🐰','🐲','👑','🏰','🚀','🦄','🎠','🐼','🎪'];
var S={name:'',gems:0,step:0,mastered:[],correct:0,wrong:0,writes:0,prizes:[],sound:true};
try{var x=JSON.parse(localStorage.getItem('azbukaV2')||'null');if(x)Object.assign(S,x)}catch(e){}
var $=function(q){return document.querySelector(q)}, C=$('#content');
function save(){try{localStorage.setItem('azbukaV2',JSON.stringify(S))}catch(e){}$('#gems').textContent=S.gems;$('#bar').style.width=Math.min(100,(S.step/(CURRICULUM.length*5))*100)+'%';$('#sound').textContent=S.sound?'🔊':'🔇';$('#world').textContent='🏡'+(S.prizes.length?' '+S.prizes.slice(-5).join(' '):' 🌳')}
function say(t){if(!S.sound)return;if('speechSynthesis'in window){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.68;u.pitch=1.12;speechSynthesis.speak(u)}catch(e){}}}
function show(id){['setup','home','lesson','prizes','parents'].forEach(function(k){$('#'+k).classList.toggle('hidden',k!==id)})}
function home(){show('home');$('#hello').textContent=(S.name?S.name+', ':'')+'продолжим приключение?';save();setTimeout(function(){say((S.name?S.name+', ':'')+'нажми большую зелёную кнопку, и отправимся в приключение!')},250)}
function sparkle(){for(var i=0;i<7;i++){var d=document.createElement('div');d.className='spark';d.textContent='✨';d.style.left=(20+Math.random()*60)+'vw';d.style.top=(45+Math.random()*20)+'vh';document.body.appendChild(d);setTimeout((function(n){return function(){n.remove()}})(d),1000)}}
function reward(n,next){S.gems+=n;save();sparkle();C.innerHTML='<div class="chest">💎</div><h2>+'+n+' кристалла!</h2><p class="hint">Отлично!</p>';say('Ура! Ты получаешь '+n+' кристалла!');setTimeout(function(){maybePrize(next)},1100)}
function maybePrize(next){var threshold=(S.prizes.length+1)*10;if(S.gems>=threshold&&S.prizes.length<PRIZES.length){var p=PRIZES[S.prizes.length];S.prizes.push(p);save();C.innerHTML='<div class="chest">🎁</div><h2>Новый подарок!</h2><div class="bigpic">'+p+'</div>';say('Сюрприз! Ты открыл новый подарок!');setTimeout(next,1700)}else setTimeout(next,300)}
function current(){return CURRICULUM[Math.min(CURRICULUM.length-1,Math.floor(S.step/5))]}
function stage(){show('lesson');var phase=S.step%5,a=current();if(phase===0)introduce(a);else if(phase===1)recognize(a,2);else if(phase===2)recognize(a,3);else if(phase===3)trace(a);else finishLetter(a)}
function introduce(a){C.innerHTML='<div class="fairy">🧚‍♀️</div><p class="hint">Смотри и слушай</p><div class="letter">'+a.l+'</div><div class="bigpic">'+a.emoji+'</div><div class="word">'+a.word+'</div><button id="hear" class="btn">🔊</button><button id="next" class="btn green">▶️</button>';function voice(){say('Познакомься. Это буква '+a.sound+'. Она говорит: '+a.sound+'-а-а. '+a.word+'. '+a.sound+'-а-а.')}$('#hear').onclick=voice;$('#next').onclick=function(){S.step++;save();reward(2,stage)};voice()}
function distractors(a,count){var learned=CURRICULUM.slice(0,Math.max(2,Math.floor(S.step/5)+1)).map(function(z){return z.l}).filter(function(z){return z!==a.l});var all='АОМСТУНКПИРЛВБДЕЖЗФХЦЧШЭЮЯ'.split('').filter(function(z){return z!==a.l});var pool=learned.concat(all);var r=[a.l];while(r.length<count){var z=pool[Math.floor(Math.random()*pool.length)];if(r.indexOf(z)<0)r.push(z)}return r.sort(function(){return Math.random()-.5})}
function recognize(a,count){var opts=distractors(a,count);C.innerHTML='<div class="fairy">🧚‍♀️</div><p class="hint">А теперь попробуй сам</p><button id="hear" class="btn">🔊</button><div class="choices">'+opts.map(function(z){return'<button class="choice" data-l="'+z+'">'+z+'</button>'}).join('')+'</div>';function prompt(){say('Найди букву '+a.sound)}$('#hear').onclick=prompt;Array.prototype.forEach.call(C.querySelectorAll('.choice'),function(b){b.onclick=function(){if(b.dataset.l===a.l){S.correct++;b.classList.add('good');save();say('Правильно! Это '+a.sound);setTimeout(function(){S.step++;save();reward(2,stage)},550)}else{S.wrong++;b.classList.add('bad');save();say('Посмотри. Нам нужна вот эта буква. '+a.sound);setTimeout(function(){b.classList.remove('bad');Array.prototype.forEach.call(C.querySelectorAll('.choice'),function(q){if(q.dataset.l===a.l)q.classList.add('good')});say('Вот она. '+a.sound+'. А теперь нажми на неё.')},500)}}});prompt()}
function trace(a){C.innerHTML='<div class="fairy">🧚‍♀️</div><p class="hint">Проведи пальчиком по букве</p><div class="canvasWrap"><div class="guide">'+a.l+'</div><canvas id="draw" width="430" height="330"></canvas></div><button id="clear" class="btn orange">↻</button><button id="done" class="btn green">✓</button>';var cv=$('#draw'),ctx=cv.getContext('2d'),down=false,last=null,pts=0;ctx.lineWidth=22;ctx.lineCap='round';ctx.strokeStyle='#7057f5';function pos(e){var r=cv.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:(q.clientX-r.left)*cv.width/r.width,y:(q.clientY-r.top)*cv.height/r.height}}function st(e){e.preventDefault();down=true;last=pos(e)}function mv(e){if(!down)return;e.preventDefault();var p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();pts+=Math.hypot(p.x-last.x,p.y-last.y);last=p}cv.addEventListener('pointerdown',st);cv.addEventListener('pointermove',mv);window.onpointerup=function(){down=false};$('#clear').onclick=function(){ctx.clearRect(0,0,cv.width,cv.height);pts=0;say('Попробуй ещё раз')};$('#done').onclick=function(){if(pts<180){say('Проведи пальчиком подольше по всей букве');return}S.writes++;S.step++;save();reward(3,stage)};say('Теперь проведи пальчиком по букве '+a.sound+'. Не спеши.')}
function finishLetter(a){C.innerHTML='<div class="chest">🏅</div><h2>Ты выучил букву!</h2><div class="letter">'+a.l+'</div><div class="bigpic">'+a.emoji+'</div><button id="next" class="btn green bigPlay">🎁 ЗАБРАТЬ ПРИЗ</button>';say('Ура! Теперь ты знаешь букву '+a.sound+'! Забирай награду!');$('#next').onclick=function(){if(S.mastered.indexOf(a.l)<0)S.mastered.push(a.l);S.step++;save();reward(5,function(){if(S.mastered.length>=2&&S.mastered.length%2===0)miniWord();else home()})}}
function miniWord(){var pair=S.mastered.slice(-2).join('');C.innerHTML='<div class="fairy">🧚‍♀️</div><h2>Секретный бонус!</h2><p class="hint">Соедини знакомые звуки</p><div class="word">'+pair.charAt(0)+' + '+pair.charAt(1)+' = '+pair+'</div><button id="hear" class="btn">🔊</button><button id="home2" class="btn green">🏠</button>';$('#hear').onclick=function(){say(pair.charAt(0)+'. '+pair.charAt(1)+'. Вместе: '+pair)};$('#home2').onclick=home;say('Ты уже знаешь две буквы. Давай соединим их!')}
function prizes(){show('prizes');$('#prizeGrid').innerHTML=PRIZES.map(function(p,i){return'<div class="rewardItem '+(i<S.prizes.length?'':'locked')+'">'+p+'<br><small>'+(i<S.prizes.length?'✓':((i+1)*10)+'💎')+'</small></div>'}).join('')}
function parents(){show('parents');$('#stats').innerHTML='<div class="stat">Изучено букв: '+S.mastered.length+' — '+(S.mastered.join(', ')||'пока нет')+'</div><div class="stat">💎 Кристаллы: '+S.gems+'</div><div class="stat">🎁 Призы: '+S.prizes.length+'</div><div class="stat">✅ Верных выборов: '+S.correct+'</div><div class="stat">🔁 Ошибок: '+S.wrong+'</div><div class="stat">✍️ Упражнений письма: '+S.writes+'</div>'}
$('#saveName').onclick=function(){S.name=$('#name').value.trim()||'друг';save();home()};$('#continue').onclick=stage;$('#collection').onclick=prizes;$('#parent').onclick=parents;$('#back').onclick=home;Array.prototype.forEach.call(document.querySelectorAll('.homeBack'),function(b){b.onclick=home});$('#sound').onclick=function(){S.sound=!S.sound;save();if(S.sound)say('Звук включён')};$('#rename').onclick=function(){show('setup');$('#name').value=S.name};$('#reset').onclick=function(){if(confirm('Сбросить весь прогресс?')){try{localStorage.removeItem('azbukaV2')}catch(e){}location.reload()}};
save();if(S.name)home();else{show('setup');setTimeout(function(){say('Взрослый, пожалуйста, напишите имя ребёнка один раз.')},300)}
})();</script></body></html>
